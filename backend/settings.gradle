rootProject.name = 'PProject'
include 'backend' // 사용자님의 프로젝트 구조에 맞게 수정 (에러 메시지에 backend라고 떴으므로)

dependencyResolutionManagement {
    // 1. 설정 파일(settings)에 정의된 저장소를 우선적으로 사용하게 합니다.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral() // 2. 여기에 이게 있어야 인터넷에서 라이브러리를 받아옵니다.
    }
}