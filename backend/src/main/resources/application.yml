spring:
  session:
    store-type: redis

  batch:
    jdbc:
      # schema.sql에 BATCH 테이블이 이미 정의되어 있으므로 never로 설정
      initialize-schema: always
    job:
      # 애플리케이션 시작 시 Job 자동 실행 방지
      enabled: false

  sql:
    init:
      # 운영: never, 개발: always (환경변수로 제어)
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/ddl/schema-tables.sql
      data-locations: classpath:db/seed/seed-data.sql
      continue-on-error: true

  task:
    scheduling:
      pool:
        # 스케줄러 스레드 풀 크기 설정
        size: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  application:
    name: ${APP_NAME:PProject}

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:fitme_project}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: utf-8

  devtools:
    livereload:
      enabled: ${DEVTOOLS_LIVERELOAD_ENABLED:true}
    restart:
      enabled: ${DEVTOOLS_RESTART_ENABLED:true}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [email, profile]
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/kakao
            scope: [account_email]
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/naver
            scope: [name, email, gender, birthday, birthyear, mobile]
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

# Actuator 설정 - ECS health check용
management:
  endpoint:
    health:
      show-details: never
      # Health check 타임아웃 설정 (5초)
      probes:
        enabled: true
  health:
    # Redis가 느릴 때 health check 실패 방지
    redis:
      enabled: false
    # DB 체크는 유지하되 빠른 응답을 위해 간단하게
    db:
      enabled: true
    diskspace:
      enabled: true

tempFolder: ${TEMP_FOLDER:C:/PProject/uploads/}
uploadPath: ${UPLOAD_PATH:file:///C:/PProject/uploads/}

# AWS S3 설정 (Disabled)
cloud:
  aws:
    credentials:
      access-key: 
      secret-key: 
    region:
      static: ap-northeast-2
    s3:
      bucket: 
      enabled: false
    cloudfront:
      domain:

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyDoNotUseInProduction}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:7200}

imgUploadLocation: ${IMG_UPLOAD_LOCATION:item}

oauth2:
  auth-request-cookie:
    name: ${OAUTH2_AUTH_REQUEST_COOKIE_NAME:OAUTH2_AUTH_REQUEST}
    ttl-seconds: ${OAUTH2_AUTH_REQUEST_COOKIE_TTL_SECONDS:300}
    secret: ${OAUTH2_AUTH_REQUEST_COOKIE_SECRET:defaultCookieSecret}

logging:
  level:
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:DEBUG}

app:
  front-base-url: ${FRONT_BASE_URL:http://localhost:5173}
  notice:
    terms-id: ${NOTICE_TERMS_ID:1}
    privacy-id: ${NOTICE_PRIVACY_ID:2}
    policy-id: ${NOTICE_POLICY_ID:3}

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender: ${SOLAPI_SENDER:}

otp:
  pepper: ${OTP_PEPPER:defaultPepper}
verify:
  pepper: ${VERIFY_PEPPER:defaultPepper}

resilience4j:
  circuitbreaker:
    instances:
      tossPayment:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      tossPayment:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

toss:
  secret-key: ${TOSS_SECRET_KEY:}