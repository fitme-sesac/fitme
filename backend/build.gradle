plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'war'
}

group = 'com.woori'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Spring Boot Starters (핵심 의존성)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // 2. View Template (Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // 3. Database Drivers
    // MySQL
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    // Pgvector (로컬 라이브러리)
    implementation files('libs/pgvector-java-0.1.6.jar')

    // [중요] 테스트용 H2 DB (테스트 실패 해결을 위해 필수)
    runtimeOnly 'com.h2database:h2'

    // 4. Lombok & DevTools
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    // 5. Utility Libraries (Mapper, JSON, SDK)
    implementation 'org.modelmapper:modelmapper:3.1.1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    implementation 'com.solapi:sdk:1.0.3'

    // 6. Swagger (API 문서화) - 최신 버전 하나로 통일
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // 7. JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 8. Tomcat (WAR 배포용)
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // 9. Testing (테스트 관련)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}