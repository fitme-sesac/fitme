name: fitme

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitme-postgres
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: fitme-redis
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - ./.env.docker
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitme-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitme-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # DB (Docker 네트워크 내 postgres 서비스로 연결)
      DB_URL: jdbc:postgresql://postgres:5432/fitme_project
      DB_USERNAME: postgres
      # DB_PASSWORD는 .env.docker에서 로드 (따옴표 없이 설정 권장)

      # Redis (used for OTP/cache etc.)
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Optional: keep file uploads inside container volume
      TEMP_FOLDER: /app/uploads/
      UPLOAD_PATH: file:/app/uploads/
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: fitme-ai-worker
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fitme_project
      DB_USER: postgres
      # DB_PASSWORD는 .env.docker에서 로드
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy  

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitme-frontend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # Vite dev proxy target (server-side) -> Docker network
      VITE_BACKEND_URL: http://backend:8080
      VITE_AI_WORKER_URL: http://ai-worker:8000

      # Vite dev server(컨테이너 내부)가 프록시할 대상
      BACKEND_TARGET: http://backend:8080
      AI_WORKER_TARGET: http://ai-worker:8000

      # 토스페이먼츠 클라이언트 키 (.env.docker의 TOSS_CLIENT_KEY 사용)
      VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend


volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
  uploads:
