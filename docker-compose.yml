name: fitme

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitme-postgres
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5432:5432"
    shm_size: 512mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: fitme-redis
    restart: unless-stopped
    command: [ "sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"" ]
    env_file:
      - ./.env.docker
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" PING" ]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitme-pgadmin
    profiles: [ "tools" ]
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitme-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # DB (Docker 네트워크 내 postgres 서비스로 연결)
      DB_URL: jdbc:postgresql://postgres:5432/fitme_project
      DB_USERNAME: postgres
      # DB_PASSWORD는 .env.docker에서 로드 (따옴표 없이 설정 권장)

      # Redis (used for OTP/cache etc.)
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Optional: keep file uploads inside container volume
      TEMP_FOLDER: /app/uploads/
      UPLOAD_PATH: file:/app/uploads/

      # Browser-facing base URLs (OAuth redirect/CORS/redirect)
      # - Local: defaults are fine (localhost)
      # - Remote: set APP_BASE_URL / FRONT_BASE_URL to your public domain
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost:5173}
      # AWS S3 (Removed)
      # AWS_S3_ENABLED: false

    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: fitme-ai-worker
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fitme_project
      DB_USER: postgres
      # DB_PASSWORD는 .env.docker에서 로드
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitme-frontend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # Vite dev proxy target (server-side) -> Docker network
      # Force frontend to use relative URLs so Vite proxy works
      VITE_API_BASE_URL: ""

      VITE_BACKEND_URL: http://backend:8080
      VITE_AI_WORKER_URL: http://ai-worker:8000

      # Vite dev server(컨테이너 내부)가 프록시할 대상
      BACKEND_TARGET: http://backend:8080
      AI_WORKER_TARGET: http://ai-worker:8000

      # 토스페이먼츠 클라이언트 키 (.env.docker의 TOSS_CLIENT_KEY 사용)
      VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}

      # 카카오맵 API 키 (.env.docker의 KAKAO_MAP_API_KEY 사용)
      VITE_KAKAO_MAP_API_KEY: ${KAKAO_MAP_API_KEY}
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - ai-worker

  # ==================================================
  # [추가됨] nGrinder Controller & Agent
  # ==================================================
  ngrinder-controller:
    image: ngrinder/controller:latest
    container_name: fitme-ngrinder-controller
    restart: unless-stopped
    ports:
      - "80:80" # nGrinder 웹 (http://localhost)
      - "16001:16001"
      - "12000-12009:12000-12009"
    volumes:
      - ngrinder-data:/opt/ngrinder-controller
    # backend가 켜질 때까지 기다릴 필요는 없으므로 depends_on은 생략하거나
    # 필요시 추가하셔도 됩니다. 여기선 독립 실행되게 두었습니다.

  ngrinder-agent:
    image: ngrinder/agent:latest
    container_name: fitme-ngrinder-agent
    restart: unless-stopped
    links:
      - ngrinder-controller:controller
    depends_on:
      - ngrinder-controller

volumes:
  pgdata:
  redisdata:
  uploads: # [추가됨] nGrinder 데이터 저장소

  ngrinder-data:
