name: fitme

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitme-postgres
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: fitme-redis
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - ./.env.docker
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitme-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitme-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # DB (Docker 네트워크 내 postgres 서비스로 연결)
      DB_URL: jdbc:postgresql://postgres:5432/fitme_project
      DB_USERNAME: postgres
      # DB_PASSWORD는 .env.docker에서 로드 (따옴표 없이 설정 권장)

      # Redis (used for OTP/cache etc.)
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Optional: keep file uploads inside container volume
      TEMP_FOLDER: /app/uploads/
      UPLOAD_PATH: file:/app/uploads/

      # Front/Redirect (OAuth2, logout redirect, CORS)
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

      # JPA schema strategy (DDL은 postgres init sql로 생성되므로 validate 권장)
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: fitme-ai-worker
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fitme_project
      DB_USER: postgres
      # DB_PASSWORD는 .env.docker에서 로드

      # CORS (frontend에서 직접 호출 시)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy  


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitme-frontend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      # 브라우저에서 접근 가능한 주소(호스트 포트)
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
      VITE_AI_WORKER_URL: ${VITE_AI_WORKER_URL:-http://localhost:8000}

      # (선택) Vite dev proxy target (컨테이너 내부 -> Docker network)
      BACKEND_TARGET: http://backend:8080
      AI_WORKER_TARGET: http://ai-worker:8000

      VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - ai-worker

volumes:
  pgdata:
  redisdata:
  uploads:
