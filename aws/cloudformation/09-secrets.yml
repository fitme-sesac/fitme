AWSTemplateFormatVersion: '2010-09-09'
Description: FitMe Secrets Manager Secrets

Parameters:
  EnvironmentName:
    Type: String
    Default: fitme
    Description: Environment name prefix

  DBHost:
    Type: String
    Description: RDS endpoint (will be updated after RDS creation)
    Default: 'pending'

  DBPort:
    Type: String
    Default: '5432'

  DBName:
    Type: String
    Default: fitme_project

  DBUsername:
    Type: String
    Default: postgres

  DBPassword:
    Type: String
    NoEcho: true
    Description: Database password

  RedisHost:
    Type: String
    Description: Redis endpoint (will be updated after Redis creation)
    Default: 'pending'

  RedisPort:
    Type: String
    Default: '6379'

  RedisPassword:
    Type: String
    NoEcho: true
    Description: Redis AUTH token

  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret

  OpenAIAPIKey:
    Type: String
    NoEcho: true
    Description: OpenAI API Key

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
    Default: ''

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ''

  KakaoClientId:
    Type: String
    Default: ''

  KakaoClientSecret:
    Type: String
    NoEcho: true
    Default: ''

  NaverClientId:
    Type: String
    Default: ''

  NaverClientSecret:
    Type: String
    NoEcho: true
    Default: ''

  TossSecretKey:
    Type: String
    NoEcho: true
    Default: ''

  TossClientKey:
    Type: String
    Default: ''

  OAuthCookieSecret:
    Type: String
    NoEcho: true
    Description: OAuth2 Authorization Request Cookie Secret (min 32 chars)
    Default: 'ThisIsCookieSecretForFitMeProjectBeSafe1234'

Resources:
  #============================================================================
  # Database Secrets
  #============================================================================
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/database
      Description: Database connection details
      SecretString: !Sub |
        {
          "DB_HOST": "${DBHost}",
          "DB_PORT": "${DBPort}",
          "DB_NAME": "${DBName}",
          "DB_USERNAME": "${DBUsername}",
          "DB_PASSWORD": "${DBPassword}",
          "DB_URL": "jdbc:postgresql://${DBHost}:${DBPort}/${DBName}"
        }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-database-secret

  #============================================================================
  # Redis Secrets
  #============================================================================
  RedisSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/redis
      Description: Redis connection details
      SecretString: !Sub |
        {
          "REDIS_HOST": "${RedisHost}",
          "REDIS_PORT": "${RedisPort}",
          "REDIS_PASSWORD": "${RedisPassword}"
        }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-redis-secret

  #============================================================================
  # Application Secrets
  #============================================================================
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/app
      Description: Application secrets
      SecretString: !Sub |
        {
          "JWT_SECRET": "${JWTSecret}",
          "OAUTH2_AUTH_REQUEST_COOKIE_SECRET": "${OAuthCookieSecret}",
          "OTP_PEPPER": "PRODUCTION_OTP_PEPPER_CHANGE_THIS_VALUE",
          "VERIFY_PEPPER": "PRODUCTION_VERIFY_PEPPER_CHANGE_THIS"
        }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-app-secret

  #============================================================================
  # API Keys
  #============================================================================
  APIKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/api-keys
      Description: External API keys
      SecretString: !Sub |
        {
          "OPENAI_API_KEY": "${OpenAIAPIKey}",
          "TOSS_SECRET_KEY": "${TossSecretKey}",
          "TOSS_CLIENT_KEY": "${TossClientKey}"
        }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-api-keys-secret

  #============================================================================
  # OAuth Secrets
  #============================================================================
  OAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/oauth
      Description: OAuth2 client credentials
      SecretString: !Sub |
        {
          "GOOGLE_CLIENT_ID": "${GoogleClientId}",
          "GOOGLE_CLIENT_SECRET": "${GoogleClientSecret}",
          "KAKAO_CLIENT_ID": "${KakaoClientId}",
          "KAKAO_CLIENT_SECRET": "${KakaoClientSecret}",
          "NAVER_CLIENT_ID": "${NaverClientId}",
          "NAVER_CLIENT_SECRET": "${NaverClientSecret}"
        }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-oauth-secret

#============================================================================
# Outputs
#============================================================================
Outputs:
  DatabaseSecretArn:
    Description: Database Secret ARN
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub ${EnvironmentName}-DatabaseSecretArn

  RedisSecretArn:
    Description: Redis Secret ARN
    Value: !Ref RedisSecret
    Export:
      Name: !Sub ${EnvironmentName}-RedisSecretArn

  AppSecretArn:
    Description: App Secret ARN
    Value: !Ref AppSecret
    Export:
      Name: !Sub ${EnvironmentName}-AppSecretArn

  APIKeysSecretArn:
    Description: API Keys Secret ARN
    Value: !Ref APIKeysSecret
    Export:
      Name: !Sub ${EnvironmentName}-APIKeysSecretArn

  OAuthSecretArn:
    Description: OAuth Secret ARN
    Value: !Ref OAuthSecret
    Export:
      Name: !Sub ${EnvironmentName}-OAuthSecretArn
