name: FitMe ECS Deploy

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
          - ai-worker

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_CLUSTER: fitme-cluster
  ENVIRONMENT_NAME: fitme

permissions:
  contents: read
  id-token: write

jobs:
  #============================================================================
  # Build and Push Docker Images
  #============================================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: ./frontend/Dockerfile
            context: ./frontend
            ecr_repo: fitme-frontend
          - service: backend
            dockerfile: ./backend/Dockerfile
            context: ./backend
            ecr_repo: fitme-backend
          - service: ai-worker
            dockerfile: ./ai-worker/Dockerfile
            context: ./ai-worker
            ecr_repo: fitme-ai-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
             VITE_API_BASE_URL=http://fitme-alb-556764388.ap-northeast-2.elb.amazonaws.com
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ github.sha }}

  #============================================================================
  # Deploy to ECS
  #============================================================================
  deploy-frontend:
    name: Deploy Frontend
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event.inputs.service == ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ENVIRONMENT_NAME }}-frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ENVIRONMENT_NAME }}-frontend \
            --region ${{ env.AWS_REGION }}

  deploy-backend:
    name: Deploy Backend
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event.inputs.service == ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ENVIRONMENT_NAME }}-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ENVIRONMENT_NAME }}-backend \
            --region ${{ env.AWS_REGION }}

  deploy-ai-worker:
    name: Deploy AI Worker
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'ai-worker' || github.event.inputs.service == ''

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ENVIRONMENT_NAME }}-ai-worker \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ENVIRONMENT_NAME }}-ai-worker \
            --region ${{ env.AWS_REGION }}

  #============================================================================
  # Notify Deployment Complete
  #============================================================================
  notify:
    name: Notify
    needs: [deploy-frontend, deploy-backend, deploy-ai-worker]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-frontend.result }}" == "success" ] && \
             [ "${{ needs.deploy-backend.result }}" == "success" ] && \
             [ "${{ needs.deploy-ai-worker.result }}" == "success" ]; then
            echo "✅ All deployments successful!"
          else
            echo "⚠️ Some deployments may have issues:"
            echo "  Frontend: ${{ needs.deploy-frontend.result }}"
            echo "  Backend: ${{ needs.deploy-backend.result }}"
            echo "  AI Worker: ${{ needs.deploy-ai-worker.result }}"
            exit 1
          fi
