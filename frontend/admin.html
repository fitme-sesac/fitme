<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리자 페이지</title>
    <style>
        body { font-family: 'Suit', sans-serif; padding: 40px; background-color: #f4f6f8; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }

        /* 입력 폼 스타일 */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }

        /* 리스트 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #555; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-ops { background-color: #e3f2fd; color: #0d47a1; } /* 운영 공지 색상 */
        .badge-policy { background-color: #ffebee; color: #c62828; } /* 정책 공지 색상 */
    </style>
</head>
<body>

<div class="container">
    <h1>📢 공지사항 등록 (Admin)</h1>

    <div class="input-group">
        <label>제목</label>
        <input type="text" id="title" placeholder="공지 제목을 입력하세요">
    </div>

    <div class="input-group">
        <label>유형 (Notice Type)</label>
        <select id="noticeType">
            <option value="OPS">운영 공지 (OPS)</option>
            <option value="POLICY">정책 변경 (POLICY)</option>
        </select>
    </div>

    <div class="input-group">
        <label>중요 여부</label>
        <input type="checkbox" id="isImportant" style="width: auto;"> 중요 공지 상단 고정
    </div>

    <div class="input-group">
        <label>내용</label>
        <textarea id="body" rows="5" placeholder="공지 내용을 입력하세요"></textarea>
    </div>

    <button onclick="createNotice()">등록하기</button>

    <hr style="margin: 40px 0;">

    <h1>📋 등록된 공지 목록</h1>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>유형</th>
            <th>제목</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody id="noticeList">
        </tbody>
    </table>
</div>

<script>
    // 백엔드 API 주소 (NoticeController 참고)
    const API_BASE_URL = "http://localhost:8080/api/admin/notices";

    // 1. 공지사항 목록 가져오기 (GET)
    async function fetchNotices() {
        try {
            // Controller: getNoticeList (@GetMapping)
            const response = await fetch(`${API_BASE_URL}?page=0&size=10`);
            const json = await response.json();

            // 백엔드가 ApiResponse로 감싸서 주므로 json.data.content에 실제 목록이 있음
            // (Page 객체는 content 안에 리스트가 들어있음)
            if (json.result === "SUCCESS") {
                renderList(json.data.content);
            } else {
                alert("불러오기 실패: " + json.message);
            }
        } catch (error) {
            console.error(error);
            alert("서버 연결 실패! 백엔드가 켜져 있나요?");
        }
    }

    // 2. 화면에 그리기
    function renderList(notices) {
        const listBody = document.getElementById("noticeList");
        listBody.innerHTML = ""; // 초기화

        notices.forEach(notice => {
            // 날짜 포맷팅 (2024-01-16T10:00:00 -> 2024-01-16)
            const date = notice.createdAt ? notice.createdAt.split('T')[0] : "-";

            // 배지 스타일 결정
            const badgeClass = notice.noticeType === 'POLICY' ? 'badge-policy' : 'badge-ops';

            const row = `
                <tr>
                    <td>${notice.id}</td>
                    <td><span class="badge ${badgeClass}">${notice.noticeType}</span></td>
                    <td>
                        ${notice.isImportant ? '⭐ ' : ''}
                        ${notice.title}
                    </td>
                    <td>${date}</td>
                </tr>
            `;
            listBody.innerHTML += row;
        });
    }

    // 3. 공지사항 등록하기 (POST)
    async function createNotice() {
        // NoticeCreateRequest DTO 구조에 맞춰 데이터 준비
        const requestData = {
            title: document.getElementById("title").value,
            body: document.getElementById("body").value,
            noticeType: document.getElementById("noticeType").value, // "OPS" or "POLICY"
            isImportant: document.getElementById("isImportant").checked,
            isPublic: true // 기본값 true로 설정
        };

        if (!requestData.title || !requestData.body) {
            alert("제목과 내용은 필수입니다!");
            return;
        }

        try {
            const response = await fetch(API_BASE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestData)
            });

            const json = await response.json();

            if (response.ok && json.result === "SUCCESS") {
                alert("공지사항이 등록되었습니다!");
                // 입력창 비우기
                document.getElementById("title").value = "";
                document.getElementById("body").value = "";
                // 목록 다시 불러오기
                fetchNotices();
            } else {
                alert("등록 실패: " + json.message);
            }
        } catch (error) {
            console.error(error);
            alert("서버 통신 오류!");
        }
    }

    // 페이지 로딩 시 목록 불러오기 실행
    fetchNotices();
</script>

</body>
</html>
